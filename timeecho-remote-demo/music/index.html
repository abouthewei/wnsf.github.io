<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Echo Music · 播放器兼容</title><link rel="stylesheet" href="music.css"></head><body>
<header><a class="brand" href="#library">Echo<span>Music</span></a><span class="header-note">AI 音乐播放场景</span><label class="import">导入我的音频<input type="file" id="importAudio" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac" multiple></label></header>
<main><section class="now-playing" aria-label="当前播放"><div class="album" id="album"><div class="album-line"></div><div class="disc"><div></div></div><span>THE LISTENING ROOM</span><strong id="coverTitle">晨间留白</strong></div><p class="eyebrow" id="kind">合成演示音轨 · 非 AI 生成歌曲</p><h1 id="trackTitle">晨间留白</h1><p class="artist" id="artist">TimeEcho / Instrumental Study</p><div class="timeline"><input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="播放进度"><div><span id="elapsed">0:00</span><span id="duration">0:00</span></div></div><div class="transport"><button id="repeat" aria-label="切换循环模式">↻</button><button id="previous" aria-label="上一首">▏◀</button><button id="play" aria-label="播放音乐">▶</button><button id="next" aria-label="下一首">▶▕</button><button id="seekMode" aria-label="进入进度调整">进度</button></div><p class="player-status" id="playerStatus" role="status">选一首，按遥控确认开始聆听。</p></section>
<section class="library" id="library" aria-label="歌曲列表"><div class="library-title"><div><small>你的聆听清单</small><h2>让音乐，慢慢展开。</h2></div><span id="trackCount">03 首</span></div><div class="track-list" id="trackList"></div><div class="music-note"><span>关于这个示例</span><p>预置 3 段可实际播放的程序合成音轨，用于验证选曲、播放和进度。可导入自己的 AI 歌曲，文件仅在当前浏览器使用，不上传。</p></div><div class="mode-help"><span class="mode-dot"></span><p id="modeHelp">浏览模式：圆环选曲，确认播放；方向键选择控件。</p></div></section></main>
<audio id="audio" preload="metadata"></audio><script src="../bridge/scene-host.js"></script><script src="music.js"></script></body></html>
