<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">充电与备用操作：交互路径示意</title><desc id="desc">遥控器需要补充电量：使用底部 USB-C 充电。；遥控器丢失或暂时没电：使用备用已配对遥控器或 USB 键盘恢复盒子操作。；继续使用：基本播放不永久锁定在单个遥控器上。</desc><rect width="1200" height="700" rx="16" fill="#1b201d"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="48" font-size="30" fill="#e5e9df" text-anchor="start">充电与备用操作 · 交互路径</text><text x="32" y="81" font-size="17" fill="#a5b1a9" text-anchor="start">PDF 第 6、17、32 页 · 分步示意，非实际界面</text><g transform="translate(24,108)"><rect x="0" y="0" width="364" height="566" rx="12" fill="#222b24" stroke="#3e4b40" stroke-width="2"/><text x="24" y="38" font-size="22" fill="#efb583" text-anchor="start">01</text><g transform="translate(2,38)"><rect x="128" y="20" width="104" height="210" rx="22" fill="#e5e0d4" stroke="#718774" stroke-width="2"/><rect x="150" y="40" width="60" height="33" rx="5" fill="#24362b" stroke="#718774" stroke-width="2"/><circle cx="180" cy="112" r="32" fill="#a4ad9b"/><circle cx="180" cy="112" r="19" fill="#dddccd"/><text x="180" y="119" font-size="16" fill="#33432f" text-anchor="middle">OK</text><circle cx="150" cy="164" r="9" fill="#afb7a5"/><circle cx="180" cy="164" r="9" fill="#afb7a5"/><circle cx="210" cy="164" r="9" fill="#afb7a5"/><rect x="146" y="190" width="68" height="17" rx="5" fill="#b9c1ad" stroke="#718774" stroke-width="2"/><text x="155" y="203" font-size="14" fill="#33432f" text-anchor="start">−</text><text x="199" y="203" font-size="14" fill="#33432f" text-anchor="start">+</text><path d="M180 232 V260 H275 V215" fill="none" stroke="#e8a065" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="260" y="188" width="30" height="34" rx="12" fill="#303d32" stroke="#718774" stroke-width="2"/><text x="180" y="250" font-size="22" fill="#efb583" text-anchor="middle">USB-C 充电</text></g><text x="22" y="346" font-size="23" fill="#e5e9df" text-anchor="start">遥控器需要补充电量</te