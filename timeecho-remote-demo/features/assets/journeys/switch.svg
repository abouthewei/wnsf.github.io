<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">碰卡与会话切换：交互路径示意</title><desc id="desc">碰读卡片：遥控器发送 NFC URL / ID，已配对盒子校验入口、授权与内容类型。；等待准备与播放：有缓存则优先使用，无缓存再联网加载；卡片移开后继续播放。；播放中碰读另一张卡：先加载预览，确认切换后渐出旧内容；同卡短时重复碰读不重启。</desc><rect width="1200" height="700" rx="16" fill="#1b201d"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="48" font-size="30" fill="#e5e9df" text-anchor="start">碰卡与会话切换 · 交互路径</text><text x="32" y="81" font-size="17" fill="#a5b1a9" text-anchor="start">PDF 第 9、11 页 · 分步示意，非实际界面</text><g transform="translate(24,108)"><rect x="0" y="0" width="364" height="566" rx="12" fill="#222b24" stroke="#3e4b40" stroke-width="2"/><text x="24" y="38" font-size="22" fill="#efb583" text-anchor="start">01</text><g transform="translate(2,38)"><rect x="115" y="40" width="130" height="174" rx="10" fill="#ded7c2" stroke="#718774" stroke-width="2"/><text x="180" y="119" font-size="24" fill="#34472f" text-anchor="middle">TimeTag</text><text x="180" y="155" font-size="18" fill="#34472f" text-anchor="middle">NFC</text><text x="180" y="250" font-size="22" fill="#efb583" text-anchor="middle">入口与授权校验</text></g><text x="22" y="346" font-size="23" fill="#e5e9df" text-anchor="start">碰读卡片</text><text x="22" y="388" font-size="20" fill="#acbbaa" text-anchor="start">遥控器发送 NFC URL / ID，已</text><text x="22" y="416" font-size="20" fill="#acbbaa" text-anchor="start">配对盒子校验入口、授权与内容类</text><text x="22" y="444" font-size="20" fill="#acbbaa" text-anchor="start">型。</text></g><text x="403" y="308" font-size="23" fill="#efb583" text-anchor="middle">→</text><g transform="translate(418,108)"><rect x="0" y="0" width="364" height="566" rx="12" fill="#222b24" stroke="#3e4b40" stroke-width="2"/><text x="24" y="38" font-size="22" fill="#efb583" text-anchor="start">02</text><g transform="translate(2,38)"><rect x="105" y="41" width="150" height="175" rx="10" fill="#304c36" stroke="#718774" stroke-width="2"/><path d="M130 