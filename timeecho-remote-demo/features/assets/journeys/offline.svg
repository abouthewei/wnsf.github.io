<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">缓存与离线内容：交互路径示意</title><desc id="desc">打开作品：盒子优先读取本地缓存，无缓存时联网加载。；断网时使用：播放已缓存或预装内容；未缓存则明确说明，不无限加载。；通过授权介质导入内容：USB 导入桥可作为附件选项，不将内容导入表述为 NFC 传输。</desc><rect width="1200" height="700" rx="16" fill="#1b201d"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="48" font-size="30" fill="#e5e9df" text-anchor="start">缓存与离线内容 · 交互路径</text><text x="32" y="81" font-size="17" fill="#a5b1a9" text-anchor="start">PDF 第 11、16、17、30 页 · 分步示意，非实际界面</text><g transform="translate(24,108)"><rect x="0" y="0" width="364" height="566" rx="12" fill="#222b24" stroke="#3e4b40" stroke-width="2"/><text x="24" y="38" font-size="22" fill="#efb583" text-anchor="start">01</text><g transform="translate(2,38)"><rect x="105" y="41" width="150" height="175" rx="10" fill="#304c36" stroke="#718774" stroke-width="2"/><path d="M130 85 H228 M130 117 H228 M130 149 H200" fill="none" stroke="#b8d1bb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="245" cy="204" r="28" fill="#e8a065"/><path d="M230 204 L241 215 L261 191" fill="none" stroke="#263a2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="250" font-size="22" fill="#efb583" text-anchor="middle">优先读取缓存</text></g><text x="22" y="346" font-size="23" fill="#e5e9df" text-anchor="start">打开作品</text><text x="22" y="388" font-size="20" fill="#acbbaa" text-anchor="start">盒子优先读取本地缓存，无缓存时</text><text x="22" y="416" font-size="20" fill="#acbbaa" text-anchor="start">联网加载。</text></g><text x="403" y="308" font-size="23" fill="#efb583" text-anchor="middle">→</text><g transform="translate(418,108)"><rect x="0" y="0" width="364" height="566" rx="12" fill="#222b24" stroke="#3e4b40" stroke-width="2"/><text x="24" y="38" font-size="22" fill="#efb583" text-anchor="start">02</text><g transform="translate(2,38)"><rect x="50" y="54" width="75" height="160" rx="10" fill="#374a39" st