<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">授权与内容隔离：交互路径示意</title><desc id="desc">首次播放私人家庭内容：先完成家庭授权；客人模式不展示家庭内容库。；公共场景读取客户卡：不自动登录私人账号，按授权访问内容。；打开外部或未知来源入口：校验 URL 类型与跳转；未知来源先确认，受信作品按声明获取有限能力。</desc><rect width="1200" height="700" rx="16" fill="#1b201d"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="48" font-size="30" fill="#e5e9df" text-anchor="start">授权与内容隔离 · 交互路径</text><text x="32" y="81" font-size="17" fill="#a5b1a9" text-anchor="start">PDF 第 21、25、27、30 页 · 分步示意，非实际界面</text><g transform="translate(24,108)"><rect x="0" y="0" width="364" height="566" rx="12" fill="#222b24" stroke="#3e4b40" stroke-width="2"/><text x="24" y="38" font-size="22" fill="#efb583" text-anchor="start">01</text><g transform="translate(2,38)"><rect x="124" y="107" width="112" height="97" rx="12" fill="#3d5640" stroke="#718774" stroke-width="2"/><path d="M142 105 V77 A38 38 0 0 1 218 77 V105" fill="none" stroke="#b8d1bb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="180" cy="151" r="8" fill="#e8a065"/><path d="M180 155 V173" fill="none" stroke="#e8a065" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="250" font-size="22" fill="#efb583" text-anchor="middle">家庭内容先授权</text></g><text x="22" y="346" font-size="23" fill="#e5e9df" text-anchor="start">首次播放私人家庭内容</text><text x="22" y="388" font-size="20" fill="#acbbaa" text-anchor="start">先完成家庭授权；客人模式不展示</text><text x="22" y="416" font-size="20" fill="#acbbaa" text-anchor="start">家庭内容库。</text></g><text x="403" y="308" font-size="23" fill="#efb583" text-anchor="middle">→</text><g transform="translate(418,108)"><rect x="0" y="0" width="364" height="566" rx="12" fill="#222b24" stroke="#3e4b40" stroke-width="2"/><text x="24" y="38" font-size="22" fill="#efb583" text-anchor="start">02</text><g transform="translate(2,38)"><rect x="115" y="40" width="130" height="174" rx="10" fill="#ded7c2" stroke="#718774" stroke-width="2"/><text x="180" y="119" font-size="24" fill="#34472f" text-anchor="middle">TimeTag</text><text x="180" y="155" font-size="18" fill="#34472f" text-anchor="middle">NFC</text><text x="180" y="250" font-size="22" fill="#efb583" text-anchor="middle">公共场景按授权访问</text></g><text x="22" y="346" font-size="23" fill="#e5e9df" text-anchor="start">公共场景读取客户卡</text><text x="22" y="388" font-size="20" fill="#acbbaa" text-anchor="start">不自动登录私人账号，按授权访问</text><text x="22" y="416" font-size="20" fill="#acbbaa" text-anchor="start">内容。</text></g><text x="797" y="308" font-size="23" fill="#efb583" text-anchor="middle">→</text><g transform="translate(812,108)"><rect x="0" y="0" width="364" height="566" rx="12" fill="#222b24" stroke="#3e4b40" stroke-width="2"/><text x="24" y="38" font-size="22" fill="#efb583" text-anchor="start">03</text><g transform="translate(2,38)"><rect x="124" y="107" width="112" height="97" rx="12" fill="#3d5640" stroke="#718774" stroke-width="2"/><path d="M142 105 V77 A38 38 0 0 1 218 77 V105" fill="none" stroke="#b8d1bb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="180" cy="151" r="8" fill="#e8a065"/><path d="M180 155 V173" fill="none" stroke="#e8a065" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="250" font-size="22" fill="#efb583" text-anchor="middle">外部网页隔离运行</text></g><text x="22" y="346" font-size="23" fill="#e5e9df" text-anchor="start">打开外部或未知来源入口</text><text x="22" y="388" font-size="20" fill="#acbbaa" text-anchor="start">校验 URL 类型与跳转；未知来源</text><text x="22" y="416" font-size="20" fill="#acbbaa" text-anchor="start">先确认，受信作品按声明获取有限</text><text x="22" y="444" font-size="20" fill="#acbbaa" text-anchor="start">能力。</text></g></g></svg>