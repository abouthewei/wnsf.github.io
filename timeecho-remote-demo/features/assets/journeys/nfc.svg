<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">NFC 碰读：交互路径示意</title><desc id="desc">拿起遥控器或短按 Card：开启约 5 秒扫描窗口，将卡背靠近上背部非金属读取区。；读取成功后移开卡片：一次短震与小图标确认读到卡，停止重复扫描；卡片离开后会话继续。；等待盒子准备作品：就绪后返回封面，首次自动进入；播放中读新卡先确认切换。</desc><rect width="1200" height="700" rx="16" fill="#1b201d"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="48" font-size="30" fill="#e5e9df" text-anchor="start">NFC 碰读 · 交互路径</text><text x="32" y="81" font-size="17" fill="#a5b1a9" text-anchor="start">PDF 第 6–9、11 页 · 分步示意，非实际界面</text><g transform="translate(24,108)"><rect x="0" y="0" width="364" height="566" rx="12" fill="#222b24" stroke="#3e4b40" stroke-width="2"/><text x="24" y="38" font-size="22" fill="#efb583" text-anchor="start">01</text><g transform="translate(2,38)"><rect x="128" y="20" width="104" height="210" rx="22" fill="#e5e0d4" stroke="#718774" stroke-width="2"/><rect x="150" y="40" width="60" height="33" rx="5" fill="#24362b" stroke="#718774" stroke-width="2"/><circle cx="180" cy="112" r="32" fill="#a4ad9b"/><circle cx="180" cy="112" r="19" fill="#dddccd"/><text x="180" y="119" font-size="16" fill="#33432f" text-anchor="middle">OK</text><circle cx="150" cy="164" r="9" fill="#afb7a5"/><circle cx="180" cy="164" r="9" fill="#afb7a5"/><circle cx="210" cy="164" r="9" fill="#afb7a5"/><rect x="146" y="190" width="68" height="17" rx="5" fill="#b9c1ad" stroke="#718774" stroke-width="2"/><text x="155" y="203" font-size="14" fill="#33432f" text-anchor="start">−</text><text x="199" y="203" font-size="14" fill="#33432f" text-anchor="start">+</text><rect x="45" y="60" width="62" height="86" rx="6" fill="#ece2cd" stroke="#718774" stroke-width="2"/><text x="76" y="103" font-size="15" fill="#33432f" text-anchor="middle">NFC</text><path d="M112 70 Q130 100 112 130" fill="none" stroke="#efb583" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="250" font-size="22" fill="#efb583" text-anchor="middle">卡背靠近读取区</text></g><text x="22" y="346" font-size="23" fill="#e5e9df" text-anchor="start">拿起遥控器或短按 Card</text><text x="22" y="388" font-size="20" fill="#acbbaa" text-anchor="start">开启约 5 秒扫描窗口，将卡背靠</text><text x="22" y="416" font-size="20" fill="#acbbaa" text-anchor="start">近上背部非金属读取区。</text></g><text x="403" y="308" font-size="23" fill="#efb583" text-anchor="middle">→</text><g transform="translate(418,108)"><rect x="0" y="0" width="364" height="566" rx="12" fill="#222b24" stroke="#3e4b40" stroke-width="2"/><text x="24" y="38" font-size="22" fill="#efb583" text-anchor="start">02</text><g transform="translate(2,38)"><circle cx="180" cy="116" r="70" fill="#304c36"/><path d="M140 117 L168 143 L224 87" fill="none" stroke="#c4ddba" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="250" font-size="22" fill="#efb583" text-anchor="middle">一次短震 · 已读到</text></g><text x="22" y="346" font-size="23" fill="#e5e9df" text-anchor="start">读取成功后移开卡片</text><text x="22" y="388" font-size="20" fill="#acbbaa" text-anchor="start">一次短震与小图标确认读到卡，停</text><text x="22" y="416" font-size="20" fill="#acbbaa" text-anchor="start">止重复扫描；卡片离开后会话继续</text><text x="22" y="444" font-size="20" fill="#acbbaa" text-anchor="start">。</text></g><text x="797" y="308" font-size="23" fill="#efb583" text-anchor="middle">→</text><g transform="translate(812,108)"><rect x="0" y="0" width="364" height="566" rx="12" fill="#222b24" stroke="#3e4b40" stroke-width="2"/><text x="24" y="38" font-size="22" fill="#efb583" text-anchor="start">03</text><g transform="translate(2,38)"><rect x="43" y="30" width="274" height="164" rx="9" fill="#25342a" stroke="#718774" stroke-width="2"/><path d="M180 196 V220 M130 223 H230" fill="none" stroke="#b8d1bb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="62" y="65" width="64" height="90" rx="3" fill="#576954" stroke="#718774" stroke-width="2"/><path d="M70 139 L88 101 L105 126 L117 112" fill="none" stroke="#c5cfb2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="142" y="65" width="64" height="90" rx="3" fill="#576954" stroke="#718774" stroke-width="2"/><path d="M150 139 L168 101 L185 126 L197 112" fill="none" stroke="#c5cfb2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="222" y="65" width="64" height="90" rx="3" fill="#576954" stroke="#718774" stroke-width="2"/><path d="M230 139 L248 101 L265 126 L277 112" fill="none" stroke="#c5cfb2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="250" font-size="22" fill="#efb583" text-anchor="middle">封面返回 · 已就绪</text></g><text x="22" y="346" font-size="23" fill="#e5e9df" text-anchor="start">等待盒子准备作品</text><text x="22" y="388" font-size="20" fill="#acbbaa" text-anchor="start">就绪后返回封面，首次自动进入；</text><text x="22" y="416" font-size="20" fill="#acbbaa" text-anchor="start">播放中读新卡先确认切换。</text></g></g></svg>