<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">安装与无电视使用：交互路径示意</title><desc id="desc">首次接 HDMI 与电源：套装出厂配对；以太网可直接配置网络，电视引导设置 Wi-Fi。；准备纯音乐使用：已预装内容可离线听；网络用有线或先完成设置。；连接音箱并碰读音乐卡：独立输出音频，不暗中要求每次打开电视。</desc><rect width="1200" height="700" rx="16" fill="#1b201d"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="48" font-size="30" fill="#e5e9df" text-anchor="start">安装与无电视使用 · 交互路径</text><text x="32" y="81" font-size="17" fill="#a5b1a9" text-anchor="start">PDF 第 16、17 页 · 分步示意，非实际界面</text><g transform="translate(24,108)"><rect x="0" y="0" width="364" height="566" rx="12" fill="#222b24" stroke="#3e4b40" stroke-width="2"/><text x="24" y="38" font-size="22" fill="#efb583" text-anchor="start">01</text><g transform="translate(2,38)"><rect x="43" y="30" width="274" height="164" rx="9" fill="#25342a" stroke="#718774" stroke-width="2"/><path d="M180 196 V220 M130 223 H230" fill="none" stroke="#b8d1bb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="78" font-size="24" fill="#e5e9df" text-anchor="middle">设备设置</text><text x="180" y="117" font-size="20" fill="#e5e9df" text-anchor="middle">网络   ·   配对</text><path d="M90 148 H270" fill="none" stroke="#b8d1bb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="250" font-size="22" fill="#efb583" text-anchor="middle">电视引导首次设置</text></g><text x="22" y="346" font-size="23" fill="#e5e9df" text-anchor="start">首次接 HDMI 与电源</text><text x="22" y="388" font-size="20" fill="#acbbaa" text-anchor="start">套装出厂配对；以太网可直接配置</text><text x="22" y="416" font-size="20" fill="#acbbaa" text-anchor="start">网络，电视引导设置 Wi-Fi。</text></g><text x="403" y="308" font-size="23" fill="#efb583" text-anchor="middle">→</text><g transform="translate(418,108)"><rect x="0" y="0" width="364" height="566" rx="12" fill="#222b24" stroke="#3e4b40" stroke-width="2"/><text x="24" y="38" font-size="22" fill="#efb583" text-anchor="start">02</text><g transform="translate(2,38)"><path d="M90 94 Q180 7 270 94 M117 125 Q180 63 243 125 M145 154 Q180 117 215 154" fill="none" stroke="#b8d1bb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="180" cy="182" r="10" fill="#b8d1bb"/><text x="180" y="250" font-size="22" fill="#efb583" text-anchor="middle">预装内容 / 有线网络</text></g><text x="22" y="346" font-size="23" fill="#e5e9df" text-anchor="start">准备纯音乐使用</text><text x="22" y="388" font-size="20" fill="#acbbaa" text-anchor="start">已预装内容可离线听；网络用有线</text><text x="22" y="416" font-size="20" fill="#acbbaa" text-anchor="start">或先完成设置。</text></g><text x="797" y="308" font-size="23" fill="#efb583" text-anchor="middle">→</text><g transform="translate(812,108)"><rect x="0" y="0" width="364" height="566" rx="12" fill="#222b24" stroke="#3e4b40" stroke-width="2"/><text x="24" y="38" font-size="22" fill="#efb583" text-anchor="start">03</text><g transform="translate(2,38)"><rect x="50" y="54" width="75" height="160" rx="10" fill="#374a39" stroke="#718774" stroke-width="2"/><circle cx="88" cy="152" r="23" fill="#a9bf9c"/><circle cx="88" cy="85" r="11" fill="#a9bf9c"/><rect x="235" y="54" width="75" height="160" rx="10" fill="#374a39" stroke="#718774" stroke-width="2"/><circle cx="273" cy="152" r="23" fill="#a9bf9c"/><circle cx="273" cy="85" r="11" fill="#a9bf9c"/><path d="M160 85 Q190 115 160 145 M181 65 Q225 115 181 165" fill="none" stroke="#e8a065" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="250" font-size="22" fill="#efb583" text-anchor="middle">独立音频播放</text></g><text x="22" y="346" font-size="23" fill="#e5e9df" text-anchor="start">连接音箱并碰读音乐卡</text><text x="22" y="388" font-size="20" fill="#acbbaa" text-anchor="start">独立输出音频，不暗中要求每次打</text><text x="22" y="416" font-size="20" fill="#acbbaa" text-anchor="start">开电视。</text></g></g></svg>