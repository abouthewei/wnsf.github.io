<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">确认、返回与焦点：交互路径示意</title><desc id="desc">用四向选择作品并确认：沿可见焦点移动，确认进入作品。；在作品焦点按确认：介绍渐显，再按渐隐；闲置隐藏工具，方向键唤醒。；选择工具并确认，或按返回 / 主页：工具焦点执行工具；返回上一层或展厅，主页结束当前作品并回到内容库。</desc><rect width="1200" height="700" rx="16" fill="#1b201d"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="48" font-size="30" fill="#e5e9df" text-anchor="start">确认、返回与焦点 · 交互路径</text><text x="32" y="81" font-size="17" fill="#a5b1a9" text-anchor="start">PDF 第 7、10、12 页 · 分步示意，非实际界面</text><g transform="translate(24,108)"><rect x="0" y="0" width="364" height="566" rx="12" fill="#222b24" stroke="#3e4b40" stroke-width="2"/><text x="24" y="38" font-size="22" fill="#efb583" text-anchor="start">01</text><g transform="translate(2,38)"><rect x="43" y="30" width="274" height="164" rx="9" fill="#25342a" stroke="#718774" stroke-width="2"/><path d="M180 196 V220 M130 223 H230" fill="none" stroke="#b8d1bb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="62" y="65" width="64" height="90" rx="3" fill="#576954" stroke="#718774" stroke-width="2"/><path d="M70 139 L88 101 L105 126 L117 112" fill="none" stroke="#c5cfb2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="142" y="65" width="64" height="90" rx="3" fill="#576954" stroke="#718774" stroke-width="2"/><path d="M150 139 L168 101 L185 126 L197 112" fill="none" stroke="#c5cfb2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="222" y="65" width="64" height="90" rx="3" fill="#576954" stroke="#718774" stroke-width="2"/><path d="M230 139 L248 101 L265 126 L277 112" fill="none" stroke="#c5cfb2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="58" y="61" width="72" height="98" rx="5" fill="none" stroke="#e8a065" stroke-width="2"/><text x="180" y="250" font-size="22" fill="#efb583" text-anchor="middle">可见焦点 → 确认</text></g><text x="22" y="346" font