<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">语音编排与撤销：交互路径示意</title><desc id="desc">说“按时间重新看 / 只看建筑”：生成临时路线，展示范围和数量，不改变原作。；说“把这些做成三分钟演示”：复用已授权素材，提供编排预览；确认后另存版本。；说“撤销刚才的变化”：恢复上一份视图或未发布版本，保留可回退记录。</desc><rect width="1200" height="700" rx="16" fill="#1b201d"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="48" font-size="30" fill="#e5e9df" text-anchor="start">语音编排与撤销 · 交互路径</text><text x="32" y="81" font-size="17" fill="#a5b1a9" text-anchor="start">PDF 第 11、13、30 页 · 分步示意，非实际界面</text><g transform="translate(24,108)"><rect x="0" y="0" width="364" height="566" rx="12" fill="#222b24" stroke="#3e4b40" stroke-width="2"/><text x="24" y="38" font-size="22" fill="#efb583" text-anchor="start">01</text><g transform="translate(2,38)"><rect x="43" y="30" width="274" height="164" rx="9" fill="#25342a" stroke="#718774" stroke-width="2"/><path d="M180 196 V220 M130 223 H230" fill="none" stroke="#b8d1bb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 130 L150 75 L220 130 L278 75" fill="none" stroke="#b8d1bb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="90" cy="130" r="9" fill="#e8a065"/><circle cx="150" cy="75" r="9" fill="#e8a065"/><circle cx="220" cy="130" r="9" fill="#e8a065"/><circle cx="278" cy="75" r="9" fill="#e8a065"/><text x="180" y="250" font-size="22" fill="#efb583" text-anchor="middle">临时路线 · 不改原作</text></g><text x="22" y="346" font-size="23" fill="#e5e9df" text-anchor="start">说“按时间重新看 / 只看建</text><text x="22" y="376" font-size="23" fill="#e5e9df" text-anchor="start">筑”</text><text x="22" y="418" font-size="20" fill="#acbbaa" text-anchor="start">生成临时路线，展示范围和数量，</text><text x="22" y="446" font-size="20" fill="#acbbaa" text-anchor="start">不改变原作。</text></g><text x="403" y="308" font-size="23" fill="#efb583" text-anchor="middle">→</text><g transform="translate(418,108)"><rect x="0" y="0" width="364" height="566" rx="12" fill="#222b24" stroke="#3e4b40" stroke-width="2"/><text x="24" y="38" font-size="22" fill="#efb583" text-anchor="start">02</text><g transform="translate(2,38)"><rect x="43" y="30" width="274" height="164" rx="9" fill="#25342a" stroke="#718774" stroke-width="2"/><path d="M180 196 V220 M130 223 H230" fill="none" stroke="#b8d1bb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="85" font-size="24" fill="#e5e9df" text-anchor="middle">新作品预览</text><rect x="109" y="115" width="142" height="46" rx="6" fill="#b8d1bb" stroke="#718774" stroke-width="2"/><text x="180" y="146" font-size="20" fill="#27382b" text-anchor="middle">确认切换</text><text x="180" y="250" font-size="22" fill="#efb583" text-anchor="middle">编排预览 → 确认另存</text></g><text x="22" y="346" font-size="23" fill="#e5e9df" text-anchor="start">说“把这些做成三分钟演示”</text><text x="22" y="388" font-size="20" fill="#acbbaa" text-anchor="start">复用已授权素材，提供编排预览；</text><text x="22" y="416" font-size="20" fill="#acbbaa" text-anchor="start">确认后另存版本。</text></g><text x="797" y="308" font-size="23" fill="#efb583" text-anchor="middle">→</text><g transform="translate(812,108)"><rect x="0" y="0" width="364" height="566" rx="12" fill="#222b24" stroke="#3e4b40" stroke-width="2"/><text x="24" y="38" font-size="22" fill="#efb583" text-anchor="start">03</text><g transform="translate(2,38)"><path d="M231 150 A66 66 0 1 1 224 66 M224 66 L197 66 M224 66 V39" fill="none" stroke="#e8a065" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="250" font-size="22" fill="#efb583" text-anchor="middle">撤销并恢复上一视图</text></g><text x="22" y="346" font-size="23" fill="#e5e9df" text-anchor="start">说“撤销刚才的变化”</text><text x="22" y="388" font-size="20" fill="#acbbaa" text-anchor="start">恢复上一份视图或未发布版本，保</text><text x="22" y="416" font-size="20" fill="#acbbaa" text-anchor="start">留可回退记录。</text></g></g></svg>