<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">盒子接口与硬件职责示意</title><desc id="desc">依据 PDF 第 15 至 17、31、32 页绘制。后部 HDMI、Ethernet、USB-C 电源、USB-A、3.5 mm Line-out，内部无线、计算与散热职责。</desc><rect width="1200" height="680" rx="14" fill="#1b201d"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="44" font-size="24" fill="#dce5db" text-anchor="start">TimeEcho Box · 接口与硬件</text><text x="36" y="76" font-size="13" fill="#a5b1a9" text-anchor="start">依据 PDF 绘制 · 接口顺序示意，非尺寸或电路图</text><path d="M300 160 L340 125 H860 L900 160Z" fill="#414b3d"/><rect x="300" y="160" width="600" height="135" rx="18" fill="#d8d5c9"/><text x="600" y="115" font-size="15" fill="#a5b1a9" text-anchor="middle">后部接口</text><rect x="338" y="198" width="54" height="30" rx="3" fill="#29342e" stroke="#8c9783"/><text x="365" y="270" font-size="15" fill="#43503c" text-anchor="middle">01</text><polyline points="365,295 365,328" fill="none" stroke="#809b83" stroke-width="1.4"/><text x="130" y="364" font-size="16" fill="#dce5db" text-anchor="middle">01  HDMI</text><text x="130" y="394" font-size="14" fill="#a5b1a9" text-anchor="middle">连接电视 / 兼容音响</text><rect x="453" y="198" width="54" height="30" rx="3" fill="#29342e" stroke="#8c9783"/><text x="480" y="270" font-size="15" fill="#43503c" text-anchor="middle">02</text><polyline points="480,295 480,328" fill="none" stroke="#809b83" stroke-width="1.4"/><text x="365" y="364" font-size="16" fill="#dce5db" text-anchor="middle">02  Ethernet</text><text x="365" y="394" font-size="14" fill="#a5b1a9" text-anchor="middle">有线联网</text><rect x="573" y="198" width="54" height="20" rx="7" fill="#29342e" stroke="#8c9783"/><text x="600" y="270" font-size="15" fill="#43503c" text-anchor="middle">03</text><polyline points="600,295 600,328" fill="none" stroke="#809b83" stroke-width="1.4"/><text x="600" y="364" font-size="16" fill="#dce5db" text-anchor="middle">03  USB-C 电源</text><text x="600" y="394" font-size="14" fill="#a5b1a9" text-anchor="middle">盒子供电</text><rect x="693" y="198" width="54" height="30" rx="3" fill="#29342e" stroke="#8c9783"/><text x="720" y="270" font-size="15" fill="#43503c" text-anchor="middle">04</text><polyline points="720,295 720,328" fill="none" stroke="#809b83" stroke-width="1.4"/><text x="835" y="364" font-size="16" fill="#dce5db" text-anchor="middle">04  USB-A</text><text x="835" y="394" font-size="14" fill="#a5b1a9" text-anchor="middle">外接 USB 设备</text><circle cx="835" cy="213" r="14" fill="#29342e" stroke="#8c9783"/><text x="835" y="270" font-size="15" fill="#43503c" text-anchor="middle">05</text><polyline points="835,295 835,328" fill="none" stroke="#809b83" stroke-width="1.4"/><text x="1070" y="364" font-size="16" fill="#dce5db" text-anchor="middle">05  3.5 mm Line-out</text><text x="1070" y="394" font-size="14" fill="#a5b1a9" text-anchor="middle">接有源音箱 / 功放</text><rect x="36" y="448" width="340" height="110" rx="8" fill="#252d27" stroke="#ffffff18"/><text x="56" y="484" font-size="18" fill="#dce5db" text-anchor="start">无线与控制</text><text x="56" y="519" font-size="14" fill="#a5b1a9" text-anchor="start">BLE 接收遥控 · Wi-Fi 获取作品</text><rect x="430" y="448" width="340" height="110" rx="8" fill="#252d27" stroke="#ffffff18"/><text x="450" y="484" font-size="18" fill="#dce5db" text-anchor="start">计算与存储</text><text x="450" y="519" font-size="14" fill="#a5b1a9" text-anchor="start">Linux 路线 · 4 GB / 32 GB 目标</text><rect x="824" y="448" width="340" height="110" rx="8" fill="#252d27" stroke="#ffffff18"/><text x="844" y="484" font-size="18" fill="#dce5db" text-anchor="start">结构与维护</text><text x="844" y="519" font-size="14" fill="#a5b1a9" text-anchor="start">被动散热 · 隐蔽维护复位</text><text x="36" y="607" font-size="16" fill="#dce5db" text-anchor="start">机身保留微弱状态提示；不设日常旋钮、点阵或 NFC 承托。</text><text x="36" y="640" font-size="14" fill="#a5b1a9" text-anchor="start">维护复位与状态提示的精确位置、灯效和按压时序未定义，因此不标注为已确定结构。</text></g></svg>